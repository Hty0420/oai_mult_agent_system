<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 34px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 17px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #516071; }
      .lane { fill: #ffffff; stroke: #dde4ee; stroke-width: 2; rx: 14; }
      .lane-title { font: 700 19px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #2c3c4f; }
      .box { fill: #ffffff; stroke: #9fb0c4; stroke-width: 2; rx: 10; }
      .box-blue { fill: #eaf3ff; stroke: #4d8edb; }
      .box-green { fill: #ebf8f0; stroke: #45a66b; }
      .box-orange { fill: #fff3e4; stroke: #d98a29; }
      .box-purple { fill: #f3edff; stroke: #8b65d9; }
      .box-red { fill: #fff0f0; stroke: #d45d5d; }
      .box-gray { fill: #f4f6f8; stroke: #8d9aa8; }
      .label { font: 700 17px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .small { font: 400 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #4e5f72; }
      .tiny { font: 400 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #607086; }
      .arrow { stroke: #526173; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .soft-arrow { stroke: #7a8797; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead-soft); stroke-dasharray: 7 6; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#526173"/>
    </marker>
    <marker id="arrowhead-soft" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7a8797"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1160"/>
  <text class="title" x="80" y="72">OAI MCP KOA MRI 医学影像分析系统整体框架图</text>
  <text class="subtitle" x="80" y="104">Gradio / FastAPI 前端入口，LangGraph 多智能体调度，MCP 工具服务，影像算法与 MySQL 持久化协同工作</text>

  <rect class="lane" x="60" y="140" width="1480" height="132"/>
  <text class="lane-title" x="86" y="176">1. 用户交互层</text>
  <rect class="box box-blue" x="100" y="198" width="250" height="52"/>
  <text class="label" x="225" y="220" text-anchor="middle">用户</text>
  <text class="small" x="225" y="240" text-anchor="middle">MRI / 标签 / 自然语言请求</text>
  <rect class="box box-blue" x="470" y="190" width="290" height="68"/>
  <text class="label" x="615" y="216" text-anchor="middle">Gradio Chat UI</text>
  <text class="small" x="615" y="238" text-anchor="middle">src/app.py</text>
  <rect class="box box-blue" x="880" y="190" width="300" height="68"/>
  <text class="label" x="1030" y="214" text-anchor="middle">FastAPI Session</text>
  <text class="small" x="1030" y="236" text-anchor="middle">登录 / 注册 / 上传 / 下载</text>
  <path class="arrow" d="M350 224 H470"/>
  <path class="arrow" d="M760 224 H880"/>

  <rect class="lane" x="60" y="302" width="1480" height="300"/>
  <text class="lane-title" x="86" y="338">2. 对话客户端与 LangGraph 多智能体层</text>
  <rect class="box box-green" x="170" y="372" width="300" height="78"/>
  <text class="label" x="320" y="400" text-anchor="middle">OAI_ChatBot</text>
  <text class="small" x="320" y="422" text-anchor="middle">src/oai_client.py</text>
  <text class="tiny" x="320" y="442" text-anchor="middle">历史管理 / 记忆摘要 / MCP 初始化</text>
  <rect class="box box-green" x="600" y="372" width="330" height="78"/>
  <text class="label" x="765" y="400" text-anchor="middle">MultiAgentOrchestrator</text>
  <text class="small" x="765" y="422" text-anchor="middle">src/agents/orchestrator.py</text>
  <text class="tiny" x="765" y="442" text-anchor="middle">LangGraph StateGraph</text>
  <rect class="box box-green" x="1060" y="372" width="280" height="78"/>
  <text class="label" x="1200" y="400" text-anchor="middle">RouterAgent</text>
  <text class="small" x="1200" y="422" text-anchor="middle">意图识别 / 智能体路由</text>
  <path class="arrow" d="M1030 258 V320 H320 V372"/>
  <path class="arrow" d="M470 411 H600"/>
  <path class="arrow" d="M930 411 H1060"/>

  <rect class="box box-purple" x="110" y="500" width="190" height="58"/>
  <text class="label" x="205" y="523" text-anchor="middle">Segmentation</text>
  <text class="small" x="205" y="544" text-anchor="middle">MRI 分割</text>
  <rect class="box box-purple" x="330" y="500" width="190" height="58"/>
  <text class="label" x="425" y="523" text-anchor="middle">Feature Extraction</text>
  <text class="small" x="425" y="544" text-anchor="middle">特征提取</text>
  <rect class="box box-purple" x="550" y="500" width="190" height="58"/>
  <text class="label" x="645" y="523" text-anchor="middle">Classification</text>
  <text class="small" x="645" y="544" text-anchor="middle">KL 分级分类</text>
  <rect class="box box-purple" x="770" y="500" width="190" height="58"/>
  <text class="label" x="865" y="523" text-anchor="middle">Feature Combination</text>
  <text class="small" x="865" y="544" text-anchor="middle">特征组合</text>
  <rect class="box box-purple" x="990" y="500" width="190" height="58"/>
  <text class="label" x="1085" y="523" text-anchor="middle">Web Search</text>
  <text class="small" x="1085" y="544" text-anchor="middle">医学网络搜索</text>
  <rect class="box box-purple" x="1210" y="500" width="190" height="58"/>
  <text class="label" x="1305" y="523" text-anchor="middle">Conversation</text>
  <text class="small" x="1305" y="544" text-anchor="middle">普通对话</text>

  <path class="arrow" d="M1200 450 V472 H205 V500"/>
  <path class="arrow" d="M1200 450 V472 H425 V500"/>
  <path class="arrow" d="M1200 450 V472 H645 V500"/>
  <path class="arrow" d="M1200 450 V472 H865 V500"/>
  <path class="arrow" d="M1200 450 V472 H1085 V500"/>
  <path class="arrow" d="M1200 450 V500 H1305"/>

  <rect class="lane" x="60" y="632" width="1480" height="220"/>
  <text class="lane-title" x="86" y="668">3. MCP 工具调用层</text>
  <rect class="box box-orange" x="585" y="698" width="430" height="76"/>
  <text class="label" x="800" y="726" text-anchor="middle">MCPToolManager</text>
  <text class="small" x="800" y="748" text-anchor="middle">src/agents/tool_manager.py</text>
  <text class="tiny" x="800" y="768" text-anchor="middle">stdio 子进程连接 / 工具注册 / call_tool</text>

  <rect class="box box-orange" x="130" y="792" width="355" height="42"/>
  <text class="small" x="307" y="818" text-anchor="middle">auto_experiment_server.py</text>
  <rect class="box box-orange" x="622" y="792" width="355" height="42"/>
  <text class="small" x="800" y="818" text-anchor="middle">lasso_class_features_server.py</text>
  <rect class="box box-orange" x="1115" y="792" width="355" height="42"/>
  <text class="small" x="1292" y="818" text-anchor="middle">web_search_server.py</text>

  <path class="arrow" d="M205 558 V626 H800 V698"/>
  <path class="arrow" d="M425 558 V626 H800 V698"/>
  <path class="arrow" d="M645 558 V626 H800 V698"/>
  <path class="arrow" d="M865 558 V626 H800 V698"/>
  <path class="arrow" d="M1085 558 V626 H800 V698"/>
  <path class="arrow" d="M1305 558 V626 H800 V698"/>
  <path class="arrow" d="M800 774 V792"/>
  <path class="arrow" d="M800 774 V782 H307 V792"/>
  <path class="arrow" d="M800 774 V782 H1292 V792"/>

  <rect class="lane" x="60" y="882" width="1480" height="178"/>
  <text class="lane-title" x="86" y="918">4. 算法与数据产物层</text>
  <rect class="box box-red" x="100" y="946" width="290" height="70"/>
  <text class="label" x="245" y="972" text-anchor="middle">分割与实验工具</text>
  <text class="small" x="245" y="994" text-anchor="middle">U-Mamba / LKM-UNet / LightM-UNet</text>
  <rect class="box box-red" x="430" y="946" width="250" height="70"/>
  <text class="label" x="555" y="972" text-anchor="middle">特征提取</text>
  <text class="small" x="555" y="994" text-anchor="middle">Radiomics / MEAS / LDSE</text>
  <rect class="box box-red" x="720" y="946" width="250" height="70"/>
  <text class="label" x="845" y="972" text-anchor="middle">分类算法</text>
  <text class="small" x="845" y="994" text-anchor="middle">LASSO / Filter / SHAP</text>
  <rect class="box box-red" x="1010" y="946" width="210" height="70"/>
  <text class="label" x="1115" y="972" text-anchor="middle">辅助算法</text>
  <text class="small" x="1115" y="994" text-anchor="middle">增强 / 质量评估</text>
  <rect class="box box-red" x="1260" y="946" width="230" height="70"/>
  <text class="label" x="1375" y="972" text-anchor="middle">输出结果</text>
  <text class="small" x="1375" y="994" text-anchor="middle">CSV / PKL / PNG / NII.GZ</text>

  <path class="arrow" d="M307 834 V946"/>
  <path class="arrow" d="M307 834 V870 H555 V946"/>
  <path class="arrow" d="M800 834 V946"/>
  <path class="arrow" d="M800 834 V870 H1115 V946"/>
  <path class="arrow" d="M1292 834 V870 H1375 V946"/>
  <path class="arrow" d="M390 981 H430"/>
  <path class="arrow" d="M680 981 H720"/>
  <path class="arrow" d="M970 981 H1010"/>
  <path class="arrow" d="M1220 981 H1260"/>

  <rect class="box box-gray" x="110" y="1082" width="390" height="54"/>
  <text class="label" x="305" y="1105" text-anchor="middle">MySQL</text>
  <text class="small" x="305" y="1126" text-anchor="middle">用户账号 / 会话历史 / 记忆摘要</text>
  <rect class="box box-gray" x="610" y="1082" width="390" height="54"/>
  <text class="label" x="805" y="1105" text-anchor="middle">配置文件</text>
  <text class="small" x="805" y="1126" text-anchor="middle">.env / db_config.json / server_config.json</text>
  <rect class="box box-gray" x="1110" y="1082" width="390" height="54"/>
  <text class="label" x="1305" y="1105" text-anchor="middle">返回前端</text>
  <text class="small" x="1305" y="1126" text-anchor="middle">文本回复 / 图表展示 / 文件下载</text>

  <path class="soft-arrow" d="M305 1082 V1070 H320 V450"/>
  <path class="soft-arrow" d="M805 1082 V1040 H800 V774"/>
  <path class="arrow" d="M1375 1016 V1082 H1305"/>
