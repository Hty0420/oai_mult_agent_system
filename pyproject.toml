    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "zai-sdk>=0.2.2",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-image>=0.21.0",
    "monai>=1.3.0",
